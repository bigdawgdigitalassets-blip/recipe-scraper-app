<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Scraper</title>
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        h1 { font-size: 2.5rem; margin-bottom: 5px; }
        p { color: #a5b1c2; margin-top: 0; margin-bottom: 25px; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #1c2541;
            background-color: #1c2541;
            color: white;
            font-size: 1rem;
        }
        button {
            padding: 12px 24px;
            border-radius: 4px;
            border: none;
            background-color: #ffffff;
            color: #0b132b;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .footer { color: #57606f; font-size: 0.8rem; margin-top: 30px; }
        #recipe-output {
            margin-top: 20px;
            text-align: left;
            background: #1c2541;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        select {
            padding: 6px 12px;
            background: #0b132b;
            color: white;
            border: 1px solid #57606f;
            border-radius: 4px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Recipe Scraper</h1>
        <p>Paste an Allrecipes URL to instantly view the layout.</p>
        
        <div class="input-group">
            <input type="text" id="recipe-url" placeholder="https://allrecipes.com...">
            <button id="extract-btn">Extract recipe</button>
        </div>

        <div id="recipe-output">
            <h3 id="recipe-title"></h3>
            
            <div style="margin: 15px 0; background: #0b132b; padding: 12px; border-radius: 4px; display: flex; align-items: center; gap: 10px;">
                <label for="scale-select" style="font-weight: bold;">Scale Recipe Size:</label>
                <select id="scale-select">
                    <option value="0.5">Half Size (0.5x)</option>
                    <option value="1" selected>Original (1x)</option>
                    <option value="2">Double Size (2x)</option>
                    <option value="3">Triple Size (3x)</option>
                </select>
            </div>

            <strong>Ingredients:</strong>
            <ul id="ingredients-list"></ul>
        </div>

        <div class="footer">For personal educational extraction purposes.</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
